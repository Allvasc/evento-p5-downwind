name: p5wellness-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p5wellness
      POSTGRES_PASSWORD: p5wellness_dev
      POSTGRES_DB: p5wellness
    ports:
      - "5434:5432"
    volumes:
      - p5wellness_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p5wellness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      APP_ENV: development
      PORT: "8090"
      DATABASE_URL: postgres://p5wellness:p5wellness_dev@postgres:5432/p5wellness?sslmode=disable
      PUBLIC_SITE_URL: http://localhost:8081
      PUBLIC_ADMIN_URL: http://localhost:8081
      # Passados via variável de ambiente do shell (não via env_file) porque o Compose
      # interpreta "$" dentro de env_file como início de variável — corromperia a chave.
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:8081"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ../frontend/apps/site/dist:/srv/site:ro
    depends_on:
      - backend

volumes:
  p5wellness_local_postgres:
