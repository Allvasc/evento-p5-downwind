name: p5wellness-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - p5wellness_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    # Variáveis passadas explicitamente (não via env_file) — o Compose interpreta "$"
    # dentro de arquivos env_file como início de variável, o que corrompe silenciosamente
    # a chave da Asaas (formato "$aact_..."). Os valores vêm do .env na raiz, que o
    # `docker compose` já carrega sozinho para preencher os "${...}" abaixo.
    environment:
      APP_ENV: production
      PORT: "8090"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-P5 Wellness Club <wellness@p5beachclub.com.br>}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/apps/site/dist:/srv/site:ro
      - ../frontend/apps/admin/dist:/srv/admin:ro
      - p5wellness_caddy_data:/data
      - p5wellness_caddy_config:/config
    depends_on:
      - backend

volumes:
  p5wellness_postgres_data:
  p5wellness_caddy_data:
  p5wellness_caddy_config:
